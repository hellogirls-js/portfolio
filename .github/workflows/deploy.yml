name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [strapi-publish]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check Repository Variables
        run: |
          test -n "$VITE_STRAPI_URL" || { echo "VITE_STRAPI_URL is missing"; exit 1; }
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "VITE_TURNSTILE_SITE_KEY is missing"; exit 1; }
        env:
          VITE_STRAPI_URL: ${{ vars.VITE_STRAPI_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Build Website
        run: bun run build
        env:
          VITE_STRAPI_URL: ${{ vars.VITE_STRAPI_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          rsync -az --delete dist/client/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/about.hellogirls.info/repo
